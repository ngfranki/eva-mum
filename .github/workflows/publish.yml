# 慢慢小屋：main 有改動就自動 build，再將靜態網站推去 gh-pages 分支。
# GitHub Pages 由 gh-pages 分支（/ root）發佈；唔使再開 Mac。
name: Build and publish 慢慢小屋

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      # --ignore-scripts: build doesn't need any install scripts (same as the verified Mac build).
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Sanity check output
        run: |
          test -f out/index.html
          test -f out/mum-api-shim.js
          test -d out/_next
          if grep -rIlE 'sb_secret_|service_role' out; then
            echo "Secret-looking string found in build output; refusing to publish." >&2
            exit 1
          fi

      - name: Publish to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin gh-pages; then
            git reset -q --soft FETCH_HEAD
          fi
          rsync -a --delete --exclude .git "$GITHUB_WORKSPACE/source/out/" ./
          touch .nojekyll
          printf '# 慢慢小屋 · 已 build 網站\n\n呢個分支由 GitHub Actions 自動產生，請唔好手動改。原始碼喺 main 分支 `source/`。\n' > README.md
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q origin HEAD:gh-pages
